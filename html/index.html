<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Product Cards</title>
  <link rel="stylesheet" href="style.css" />

 
</head>
<body>

  <!-- CSS Grid Container starts here -->
  <div class="product-grid">

    <!-- Card 1 -->
    <div class="product-card">
      <div class="image-container">
        <button class="wishlist-btn">❤️</button>
        <span class="discount-badge">6% OFF</span>
        <!-- Placeholder image resembling the mango pulp tin container color -->
        <img class="product-image" src="img.jpg" alt="Alphonso Mango Pulp">
        <button class="cart-btn">🛒</button>
      </div>
      <h3 class="product-title">Alphonso <br> Mango Pul...</h3>
      <p class="supplier-name">Sasto Sulav Express</p>
      <div class="price-box">
        <span class="current-price">¥ 648</span>
        <span class="original-price">694</span>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="product-card">
      <div class="image-container">
        <button class="wishlist-btn">❤️</button>
        <span class="discount-badge">17% OFF</span>
        <!-- Placeholder image resembling the chiura bag color -->
        <img class="product-image" src="img.jpg" alt="Kurum Kurum Chiura">
        <button class="cart-btn">🛒</button>
      </div>
      <h3 class="product-title">Kurum Kurum <br> Chiura...</h3>
      <p class="supplier-name">Sasto Sulav Express</p>
      <div class="price-box">
        <span class="current-price">¥ 444</span>
        <span class="original-price">537</span>
      </div>
    </div>

  </div>

</body>
</html>
